<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <h1>Welcome to EasyEscrow-1</h1>
  {% if user.is_authenticated %}
    <p>Hello, {{ user.email }}!</p>
    <a href="{% url 'account_logout' %}">Logout</a>
  {% else %}
    <p>You are not logged in.</p>
    <a href="{% url 'account_login' %}">Login</a> |
    <a href="{% url 'account_signup' %}">Sign Up</a>
  {% endif %}
</body>
</html>
